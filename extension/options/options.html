<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Guardra Settings</title>
  <style>
    :root {
      --bg: #09090b;
      --card: #121215;
      --border: #27272a;
      --text: #f4f4f5;
      --muted: #a1a1aa;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: var(--bg);
      color: var(--text);
      padding: 36px 20px;
      max-width: 540px;
      margin: 0 auto;
    }
    h2 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 4px;
      letter-spacing: -0.2px;
    }
    p.subtitle {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 24px;
      line-height: 1.4;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    label {
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input[type="text"], select {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
      outline: none;
    }
    input[type="text"]:focus, select:focus {
      border-color: #52525b;
    }
    .help-text {
      font-size: 10px;
      color: #71717a;
      line-height: 1.3;
    }
    button {
      background: #f4f4f5;
      color: #09090b;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 12px;
      transition: opacity 0.15s ease;
      align-self: flex-start;
      margin-top: 4px;
    }
    button:hover {
      opacity: 0.9;
    }
    .status {
      font-size: 11px;
      color: #10b981;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <h2>Guardra Extension Settings</h2>
  <p class="subtitle">
    Guardra runs 100% standalone out-of-the-box using embedded offline datasets. You can optionally connect to your remote hosted Guardra Server.
  </p>

  <div class="card">
    <div class="form-group">
      <label for="apiBase">Remote Server API URL</label>
      <input type="text" id="apiBase" value="https://guardra-api.botvaibhav.dev" placeholder="https://guardra-api.botvaibhav.dev" />
      <span class="help-text">Production endpoint for real-time live policy NLP scoring and statutory deletion tools.</span>
    </div>

    <div class="form-group">
      <label for="defaultRegion">Default Statutory Privacy Framework</label>
      <select id="defaultRegion">
        <option value="dpdp">Digital Personal Data Protection Act 2023 (India DPDP)</option>
        <option value="gdpr">General Data Protection Regulation (EU GDPR)</option>
        <option value="ccpa">California Consumer Privacy Act (CCPA)</option>
      </select>
    </div>

    <button id="saveBtn">Save Settings</button>
    <div class="status" id="status"></div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const data = await chrome.storage.local.get(["apiBase", "defaultRegion"]);
      if (data.apiBase) document.getElementById("apiBase").value = data.apiBase;
      if (data.defaultRegion) document.getElementById("defaultRegion").value = data.defaultRegion;
    });

    document.getElementById("saveBtn").addEventListener("click", async () => {
      const apiBase = document.getElementById("apiBase").value.trim();
      const defaultRegion = document.getElementById("defaultRegion").value;
      await chrome.storage.local.set({ apiBase, defaultRegion });
      const status = document.getElementById("status");
      status.textContent = "✓ Settings saved. Standalone mode updated.";
      setTimeout(() => { status.textContent = ""; }, 3000);
    });
  </script>
</body>
</html>
